name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 00:00 UTC（越南时间早上 7 点）生成一次
  workflow_dispatch:       # 支持手动触发
  push:
    branches: ["main"]

permissions:
  contents: write          # 允许推送 output 分支

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        env:
          GITHUB_TOKEN: ${{ secrets.SNK_GITHUB_TOKEN }}   # 调用你刚添加的 PAT
        with:
          github_user_name: quisutdeuss                   # 你的 GitHub 用户名
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output                           # 输出文件推送到 output 分支
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       # 默认令牌，用于推送 output 分支
